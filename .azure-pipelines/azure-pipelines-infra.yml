trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: Dev
  - name: azureServiceConnection
    value: 'AzureConnection'
  - name: terraformWorkingDirectory
    value: 'terraform/infra'

stages:
- stage: TerraformPlan
  displayName: 'Terraform Plan'
  jobs:
  - job: Plan
    displayName: 'Init, Validate, and Plan'
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.5.7'

    - task: AzureCLI@2
      displayName: 'Terraform Init and Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        addSpnToEnvironment: true
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          # Capture credentials and subscription ID while the CLI session is active
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          # Redirect Azure CLI config to a fresh empty temp directory.
          # Terraform will find no active CLI session and will authenticate
          # exclusively via the ARM_* environment variables set above.
          export AZURE_CONFIG_DIR=$(mktemp -d)

          cd $(terraformWorkingDirectory)
          terraform init -input=false
          terraform fmt -check
          terraform validate
          terraform plan -input=false -out=tfplan

    - task: PublishPipelineArtifact@1
      displayName: 'Publish tfplan Artifact'
      inputs:
        targetPath: '$(terraformWorkingDirectory)/tfplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'

- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  # Only run apply on main branch
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: WaitForApproval
    displayName: 'Manual Approval'
    pool: server # Agentless job for manual validation
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 60
      inputs:
        notifyUsers: ''
        instructions: 'Please review the Terraform Plan output in the previous stage. Approve to apply the changes.'
  
  - job: Apply
    displayName: 'Apply Infrastructure'
    dependsOn: WaitForApproval
    steps:
    - checkout: self
    
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.5.7'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download tfplan Artifact'
      inputs:
        artifact: 'tfplan'
        path: '$(terraformWorkingDirectory)'

    - task: AzureCLI@2
      displayName: 'Terraform Apply'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        addSpnToEnvironment: true
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          # Capture credentials and subscription ID while the CLI session is active
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          # Redirect Azure CLI config to a fresh empty temp directory.
          # Terraform will find no active CLI session and authenticate via ARM_* env vars.
          export AZURE_CONFIG_DIR=$(mktemp -d)

          cd $(terraformWorkingDirectory)
          terraform init -input=false
          terraform apply -auto-approve tfplan
