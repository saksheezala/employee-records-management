trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: Dev
  - name: azureServiceConnection
    value: 'AzureConnection'
  - name: terraformWorkingDirectory
    value: 'terraform/infra'

stages:
- stage: TerraformPlan
  displayName: 'Terraform Plan'
  jobs:
  - job: Plan
    displayName: 'Init, Validate, and Plan'
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.5.7'

    # Step 1: Use AzureCLI@2 ONLY to extract SPN credentials and export them
    # as pipeline variables. The task automatically runs 'az account clear'
    # on exit, so the CLI session is gone before Step 2 runs.
    - task: AzureCLI@2
      displayName: 'Extract Azure Credentials'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        addSpnToEnvironment: true
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "##vso[task.setvariable variable=TF_ARM_CLIENT_ID]$servicePrincipalId"
          echo "##vso[task.setvariable variable=TF_ARM_CLIENT_SECRET;issecret=true]$servicePrincipalKey"
          echo "##vso[task.setvariable variable=TF_ARM_TENANT_ID]$tenantId"
          echo "##vso[task.setvariable variable=TF_ARM_SUBSCRIPTION_ID]$(az account show --query id -o tsv)"

    # Step 2: Run Terraform in a plain Bash task with NO active Azure CLI session.
    # TF_VAR_* env vars are passed directly into the provider block via Terraform variables.
    # This is the most explicit auth method: Terraform reads no CLI session, no ARM_ env discovery.
    - task: Bash@3
      displayName: 'Terraform Init and Plan'
      env:
        TF_VAR_arm_client_id: $(TF_ARM_CLIENT_ID)
        TF_VAR_arm_client_secret: $(TF_ARM_CLIENT_SECRET)
        TF_VAR_arm_tenant_id: $(TF_ARM_TENANT_ID)
        TF_VAR_arm_subscription_id: $(TF_ARM_SUBSCRIPTION_ID)
      inputs:
        targetType: 'inline'
        script: |
          set -e
          cd $(terraformWorkingDirectory)
          terraform init -input=false
          terraform fmt -check
          terraform validate
          terraform plan -input=false -out=tfplan

    - task: PublishPipelineArtifact@1
      displayName: 'Publish tfplan Artifact'
      inputs:
        targetPath: '$(terraformWorkingDirectory)/tfplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'

- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  # Only run apply on main branch
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: WaitForApproval
    displayName: 'Manual Approval'
    pool: server # Agentless job for manual validation
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 60
      inputs:
        notifyUsers: ''
        instructions: 'Please review the Terraform Plan output in the previous stage. Approve to apply the changes.'
  
  - job: Apply
    displayName: 'Apply Infrastructure'
    dependsOn: WaitForApproval
    steps:
    - checkout: self
    
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.5.7'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download tfplan Artifact'
      inputs:
        artifact: 'tfplan'
        path: '$(terraformWorkingDirectory)'

    # Step 1: Extract SPN credentials for the Apply stage
    - task: AzureCLI@2
      displayName: 'Extract Azure Credentials'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        addSpnToEnvironment: true
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "##vso[task.setvariable variable=TF_ARM_CLIENT_ID]$servicePrincipalId"
          echo "##vso[task.setvariable variable=TF_ARM_CLIENT_SECRET;issecret=true]$servicePrincipalKey"
          echo "##vso[task.setvariable variable=TF_ARM_TENANT_ID]$tenantId"
          echo "##vso[task.setvariable variable=TF_ARM_SUBSCRIPTION_ID]$(az account show --query id -o tsv)"

    # Step 2: Apply using the exact tfplan from the Plan stage (no CLI session active)
    - task: Bash@3
      displayName: 'Terraform Apply'
      env:
        TF_VAR_arm_client_id: $(TF_ARM_CLIENT_ID)
        TF_VAR_arm_client_secret: $(TF_ARM_CLIENT_SECRET)
        TF_VAR_arm_tenant_id: $(TF_ARM_TENANT_ID)
        TF_VAR_arm_subscription_id: $(TF_ARM_SUBSCRIPTION_ID)
      inputs:
        targetType: 'inline'
        script: |
          set -e
          cd $(terraformWorkingDirectory)
          terraform init -input=false
          terraform apply -auto-approve tfplan
