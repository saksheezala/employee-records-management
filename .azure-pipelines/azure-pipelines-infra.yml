trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: Dev
  - name: azureServiceConnection
    value: 'AzureConnection'
  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform/infra'

stages:
- stage: TerraformPlan
  displayName: 'Terraform Plan'
  jobs:
  - job: Plan
    displayName: 'Init, Validate, and Plan'
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform 1.5.7'
      inputs:
        terraformVersion: '1.5.7'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: 'erboot-tfstate-rg'
        backendAzureRmStorageAccountName: 'erboottfstate'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'prod.terraform.tfstate'

    - task: Bash@3
      displayName: 'Terraform Format Check'
      inputs:
        targetType: 'inline'
        script: |
          cd $(terraformWorkingDirectory)
          terraform fmt -check

    - task: TerraformTaskV4@4
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(terraformWorkingDirectory)'
        commandOptions: '-input=false -out=tfplan'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish tfplan Artifact'
      inputs:
        targetPath: '$(terraformWorkingDirectory)/tfplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'

- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: WaitForApproval
    displayName: 'Manual Approval'
    pool: server
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 60
      inputs:
        notifyUsers: ''
        instructions: 'Please review the Terraform Plan output in the previous stage. Approve to apply the changes.'

  - job: Apply
    displayName: 'Apply Infrastructure'
    dependsOn: WaitForApproval
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform 1.5.7'
      inputs:
        terraformVersion: '1.5.7'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download tfplan Artifact'
      inputs:
        artifact: 'tfplan'
        path: '$(terraformWorkingDirectory)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: 'erboot-tfstate-rg'
        backendAzureRmStorageAccountName: 'erboottfstate'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'prod.terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(terraformWorkingDirectory)'
        commandOptions: '-auto-approve tfplan'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
