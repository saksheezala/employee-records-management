name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - terraform/**
      - .azure-pipelines/azure-pipelines-infra.yml
      - README.md
      - docs/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: Dev
  - name: azureServiceConnection
    value: 'AzureConnection'
  - name: frontendImageName
    value: 'frontend'
  - name: backendImageName
    value: 'backend'
  - name: tag
    value: '$(Build.BuildId)'

stages:
- stage: CI
  displayName: 'Continuous Integration'
  jobs:
  - job: BuildBackend
    displayName: 'Build Backend'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        cd backend
        npm ci
        npm run build
      displayName: 'Install and Build Backend'

  - job: BuildFrontend
    displayName: 'Build & Lint Frontend'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        cd frontend
        npm ci
        npm run lint
        npm run build
      displayName: 'Install, Lint, and Build Frontend'

- stage: BuildAndPushDocker
  displayName: 'Build and Push Docker Images'
  dependsOn: CI
  condition: succeeded()
  jobs:
  - job: BuildAndPush
    steps:
    - task: AzureCLI@2
      displayName: 'Build & Push Backend Image'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          REGISTRY="$(containerRegistry)"
          ACR_NAME="${REGISTRY%%.*}"   # strips .azurecr.io → erprodacr
          az acr login --name "$ACR_NAME"
          docker build \
            --label org.opencontainers.image.revision=$(Build.SourceVersion) \
            --label org.opencontainers.image.version=$(Build.BuildId) \
            -t "$REGISTRY/$(backendImageName):$(tag)" \
            -f backend/Dockerfile \
            backend/
          docker push "$REGISTRY/$(backendImageName):$(tag)"

    - task: AzureCLI@2
      displayName: 'Build & Push Frontend Image'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          REGISTRY="$(containerRegistry)"
          ACR_NAME="${REGISTRY%%.*}"   # strips .azurecr.io → erprodacr
          az acr login --name "$ACR_NAME"
          docker build \
            --build-arg VITE_API_URL=$(backendUrl) \
            --label org.opencontainers.image.revision=$(Build.SourceVersion) \
            --label org.opencontainers.image.version=$(Build.BuildId) \
            -t "$REGISTRY/$(frontendImageName):$(tag)" \
            -f frontend/Dockerfile \
            frontend/
          docker push "$REGISTRY/$(frontendImageName):$(tag)"

- stage: Deploy
  displayName: 'Deploy to Production'
  dependsOn: BuildAndPushDocker
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: AzureKeyVault@2
      displayName: 'Fetch Database Password from Key Vault'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        KeyVaultName: '$(keyVaultName)'
        SecretsFilter: 'DatabasePassword'
        RunAsPreJob: false

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        cd backend
        npm ci
        npx prisma migrate deploy
      displayName: 'Run Database Migrations'
      env:
        # Construct DATABASE_URL using the password fetched from Key Vault and postgresql:// schema
        DATABASE_URL: "postgresql://eradmin:$(DatabasePassword)@$(databaseHost):5432/employeedb?sslmode=require"

    - task: AzureWebAppContainer@1
      displayName: 'Deploy Backend to App Service'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        appName: '$(backendAppName)'
        containers: '$(containerRegistry)/$(backendImageName):$(tag)'

    - task: AzureWebAppContainer@1
      displayName: 'Deploy Frontend to App Service'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        appName: '$(frontendAppName)'
        containers: '$(containerRegistry)/$(frontendImageName):$(tag)'

    - script: |
        echo "Waiting for services to spin up..."
        for i in {1..10}; do
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" $(backendUrl)/health)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Health check succeeded!"
            exit 0
          fi
          echo "Health check failed with status $HTTP_STATUS, retrying in 10s..."
          sleep 10
        done
        echo "Health check failed after all retries!"
        exit 1
      displayName: 'Verify /health endpoint'
